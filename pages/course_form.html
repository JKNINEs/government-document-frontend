<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการหลักสูตร | สพร.3 ชลบุรี</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show { display: flex; }

        .modal-box {
            background: white;
            border-radius: 12px;
            padding: 28px;
            width: 620px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 2px solid #f0f0f0;
        }

        .modal-header h3 { margin: 0; color: #6a1b9a; font-size: 18px; }

        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #999;
            width: auto;
            height: auto;
            padding: 4px 8px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f0f0f0;
        }

        .btn-cancel {
            background: #eee;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            height: auto;
        }

        .btn-save {
            background: #6a1b9a;
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            height: auto;
        }

        .btn-save:hover { background: #4a148c; }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<!-- Topbar -->
<header class="topbar">
    <a href="../index.html" class="logo-box">
        <img src="../img/logo.png" alt="logo">
    </a>
    <nav class="top-menu">
        <a href="../home.html" class="nav-link">หน้าแรก</a>
        <a href="../index.html" class="nav-link active">ระบบจัดทำเอกสาร</a>
    </nav>
</header>

<div class="container1">
    <main class="content1">

        <!-- Page Header -->
        <div class="page-header">
            <div class="page-title">
                <i class="fas fa-book" style="font-size:22px;"></i>
                <h2 style="margin:0;">จัดการหลักสูตร</h2>
            </div>
            <div class="header-actions" style="gap:10px;">
                <a href="../index.html" class="btn-new" style="background:#6c757d;">
                    <i class="fas fa-arrow-left"></i> กลับ
                </a>
                <button class="btn-new" onclick="openModal('create')">
                    <i class="fas fa-plus"></i> เพิ่มหลักสูตรใหม่
                </button>
            </div>
        </div>

        <!-- Table -->
        <div class="staff-table-container">
            <div class="table-scroll-area">
                <table class="staff-table">
                    <thead>
                        <tr>
                            <th>รหัสหลักสูตร</th>
                            <th>ชื่อหลักสูตร</th>
                            <th style="text-align:center;">ชั่วโมง</th>
                            <th>ประเภทการฝึก</th>
                            <th>ประเภทย่อย</th>
                            <th style="text-align:center;">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="courseTableBody">
                        <tr>
                            <td colspan="6" style="text-align:center; padding:40px; color:#6a1b9a;">
                                <i class="fas fa-spinner fa-spin"></i> กำลังโหลดข้อมูล...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="courseModal">
    <div class="modal-box">
        
        <!-- Header -->
        <div class="modal-header">
            <h3 id="modalTitle">เพิ่มหลักสูตรใหม่</h3>
            <button class="modal-close btn-danger" onclick="closeModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form id="courseForm" class="form-container">

            <div class="form-group">
                <label>รหัสหลักสูตร <span style="color:red;">*</span></label>
                <input type="text" id="courseCode" placeholder="เช่น 0920-1001" required>
            </div>

            <div class="form-group">
                <label>ชื่อหลักสูตร <span style="color:red;">*</span></label>
                <input type="text" id="courseName" placeholder="ชื่อหลักสูตร" required>
            </div>

            <div class="form-group">
                <label>จำนวนชั่วโมง <span style="color:red;">*</span></label>
                <input type="number" id="courseHours" placeholder="เช่น 30" min="1" required>
            </div>

            <div class="form-group">
                <label>ประเภทการฝึก</label>
                <select id="courseType">
                    <option value="">-- เลือกประเภท --</option>
                    <option value="ทฤษฎี">ยกระดับฝีมือ</option>
                    <option value="ปฏิบัติ">อาชีพเสริม</option>
                    <option value="ออนไลน์">เตรียมเข้าทำงาน</option>
                </select>
            </div>

            <div class="form-group">
                <label>ประเภทย่อย</label>
                <input type="text" id="courseSubType" placeholder="ประเภทย่อย">
            </div>

            <!-- Footer ใช้ form-actions จาก CSS -->
            <div class="form-actions">
                <button type="button" class="btn-secondary" onclick="closeModal()">
                    ยกเลิก
                </button>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> บันทึก
                </button>
            </div>

        </form>
    </div>
</div>

<script src="../js/cours.js"></script>
</body>
</html>
