<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เข้าสู่ระบบ | สพร.3 ชลบุรี</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

<!-- Topbar -->
<header class="topbar">
    <a href="home.html" class="logo-box">
        <img src="./img/logo.png" alt="logo">
    </a>

<nav class="top-menu">
    <a href="home.html" class="nav-link">หน้าแรก</a>
    <a href="index.html" class="nav-link">ระบบจัดทำเอกสาร</a>
    <button class="login-btn" id="authBtn">
    เข้าสู่ระบบ
    </button>

</nav>
</header>

<!-- Background -->
<section class="login-bg">

  <div class="login-wrapper">
    <div class="logo1">
        <img src="./img/logo1.png" alt="logo">
    </div>

    <h1>สถาบันพัฒนาฝีมือแรงงาน <span>3 ชลบุรี</span></h1>
    <p class="subtitle">เข้าสู่ระบบเพื่อใช้บริการในส่วนของเจ้าหน้าที่</p>

    <!-- Login box -->
    <div class="login-box">
    <div class="lock-icon">
        <img src="./img/lock.png" alt="lock icon">
    </div>

    <input type="text" id="username" placeholder="ชื่อผู้ใช้งาน">
    <input type="password" id="password" placeholder="รหัสผ่าน">
    <button type="button" class="image-btn" id="loginBtn">
        <img src="./img/login.png" alt="เข้าสู่ระบบ">
        <span>เข้าสู่ระบบ</span>
    </button>
    </div>
  </div>

</section>
<script src="./js/login.js"></script>
<script src="./js/inout.js"></script>
</body>
</html>
